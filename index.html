              {upcoming.length === 0 && <div className="text-sm text-slate-400">Nothing left — you're all paid up! 🎉</div>}
              {upcoming.map((b, i) => (
                <div key={i} className="flex justify-between text-sm">
                  <span className="text-slate-600">{b.merchant}</span>
                  <span className="font-medium text-slate-700">{fmtCurrency(b.amount)}</span>
                </div>
              ))}
            </div>
          </div>
        </Card>
        <Card className="md:col-span-2 p-6">
          <h3 className="font-semibold text-slate-700 mb-3">July 2026 Bill Calendar</h3>
          <BillCalendar year={2026} month={7} items={items} todayDay={todayDay} />
        </Card>
      </div>
    </div>
  );
}

/* ============================== GOALS ============================== */

function GoalModal({ open, onClose, onSave, initial }) {
  const blank = { name: "", icon: "🎯", target: "", current: "0", deadline: "2027-01-01", color: "#4f46e5" };
  const [form, setForm] = useState(initial || blank);
  useEffect(() => { setForm(initial || blank); }, [initial, open]);

  const submit = (e) => {
    e.preventDefault();
    if (!form.name || !form.target) return;
    onSave({ ...form, target: parseFloat(form.target), current: parseFloat(form.current) || 0 });
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Goal" : "New Goal"}>
      <form onSubmit={submit}>
        <div className="grid grid-cols-4 gap-3">
          <Field label="Icon">
            <input className={inputClass} value={form.icon} onChange={e => setForm({ ...form, icon: e.target.value })} />
          </Field>
          <div className="col-span-3">
            <Field label="Goal name">
              <input className={inputClass} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required />
            </Field>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Target amount ($)">
            <input type="number" className={inputClass} value={form.target} onChange={e => setForm({ ...form, target: e.target.value })} required />
          </Field>
          <Field label="Current amount ($)">
            <input type="number" className={inputClass} value={form.current} onChange={e => setForm({ ...form, current: e.target.value })} />
          </Field>
        </div>
        <Field label="Target date">
          <input type="date" className={inputClass} value={form.deadline} onChange={e => setForm({ ...form, deadline: e.target.value })} />
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={onClose} type="button">Cancel</Button>
          <Button type="submit">Save Goal</Button>
        </div>
      </form>
    </Modal>
  );
}

function Goals({ data, actions }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [contribTarget, setContribTarget] = useState(null);
  const [contribVal, setContribVal] = useState("");

  const openAdd = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (g) => { setEditing(g); setModalOpen(true); };
  const save = (form) => {
    if (editing) actions.updateGoal({ ...form, id: editing.id });
    else actions.addGoal({ ...form, id: uid() });
    setModalOpen(false);
  };

  const submitContribution = () => {
    const v = parseFloat(contribVal);
    if (!isNaN(v) && v !== 0) actions.contributeToGoal(contribTarget.id, v);
    setContribTarget(null); setContribVal("");
  };

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Goals</h1>
          <p className="text-slate-500 text-sm mt-1">Track progress toward what matters.</p>
        </div>
        <Button className="self-start sm:self-auto" onClick={openAdd}>+ New Goal</Button>
      </div>

      <SectionNotes section="goals" data={data} actions={actions} />

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5">
        {data.goals.map(g => {
          const pct = g.target > 0 ? (g.current / g.target) * 100 : 0;
          const daysLeft = Math.ceil((new Date(g.deadline) - new Date("2026-07-27")) / 86400000);
          return (
            <Card key={g.id} className="p-5">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl flex items-center justify-center text-xl" style={{ background: g.color + "20" }}>{g.icon}</div>
                  <div>
                    <div className="font-semibold text-slate-700">{g.name}</div>
                    <div className="text-xs text-slate-400">{daysLeft > 0 ? `${daysLeft} days left` : "Past deadline"} · Target {fmtDate(g.deadline)}</div>
                  </div>
                </div>
                <button onClick={() => openEdit(g)} className="text-xs text-indigo-600 font-medium">Edit</button>
              </div>
              <ProgressBar pct={pct} color={g.color} />
              <div className="flex items-center justify-between mt-2 text-sm">
                <span className="font-semibold text-slate-700">{fmtCurrency(g.current, { decimals: false })}</span>
                <span className="text-slate-400">of {fmtCurrency(g.target, { decimals: false })} ({pct.toFixed(0)}%)</span>
              </div>
              <div className="mt-3 flex gap-2">
                <Button variant="secondary" className="text-xs px-3 py-1.5" onClick={() => { setContribTarget(g); setContribVal(""); }}>+ Add Funds</Button>
                <Button variant="danger" className="text-xs px-3 py-1.5" onClick={() => actions.deleteGoal(g.id)}>Delete</Button>
              </div>
            </Card>
          );
        })}
      </div>

      <GoalModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={save} initial={editing} />

      <Modal open={!!contribTarget} onClose={() => setContribTarget(null)} title={"Add Funds — " + (contribTarget?.name || "")}>
        <Field label="Amount ($)">
          <input type="number" className={inputClass} value={contribVal} onChange={e => setContribVal(e.target.value)} autoFocus />
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={() => setContribTarget(null)}>Cancel</Button>
          <Button onClick={submitContribution}>Add</Button>
        </div>
      </Modal>
    </div>
  );
}

/* ============================== INVESTMENTS & DEBT PAYOFF ============================== */

function InvestmentAllocation({ investments }) {
  if (!investments || investments.length === 0) return null;
  const byCategory = {};
  investments.forEach(h => { byCategory[h.category] = (byCategory[h.category] || 0) + h.value; });
  const total = Object.values(byCategory).reduce((s, v) => s + v, 0) || 1;
  const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const colors = labels.map(l => (INVESTMENT_CATEGORY_META[l] || { color: "#64748b" }).color);

  return (
    <Card className="p-6">
      <h3 className="font-semibold text-slate-700 mb-4">Investment Allocation</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <DoughnutChartCanvas labels={labels} values={values} colors={colors} height={190} />
        <div className="space-y-2">
          {entries.map(([cat, val]) => (
            <div key={cat}>
              <div className="flex items-center justify-between text-xs mb-1">
                <span className="flex items-center gap-1.5 text-slate-600">
                  <span className="w-2 h-2 rounded-full inline-block" style={{ background: (INVESTMENT_CATEGORY_META[cat] || {}).color || "#64748b" }}></span>
                  {cat}
                </span>
                <span className="font-medium text-slate-700">{fmtCurrency(val, { decimals: false })} ({((val / total) * 100).toFixed(0)}%)</span>
              </div>
              <ProgressBar pct={(val / total) * 100} color={(INVESTMENT_CATEGORY_META[cat] || {}).color} />
            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

function DebtPayoffPlanner({ debtAccounts }) {
  const [extra, setExtra] = useState(200);
  const [strategy, setStrategy] = useState("avalanche");

  const payable = debtAccounts.filter(a => a.apr != null);

  const result = useMemo(() => simulatePayoff(payable, extra, strategy), [JSON.stringify(payable), extra, strategy]);
  const payoffDate = useMemo(() => {
    const d = new Date("2026-07-27T00:00:00");
    d.setMonth(d.getMonth() + result.months);
    return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  }, [result.months]);
  const scheduleLabels = result.schedule.map((_, i) => "M" + i);

  if (payable.length === 0) return null;

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 className="font-semibold text-slate-700">Debt Payoff Planner</h3>
        <div className="flex gap-1 bg-slate-100 rounded-lg p-1">
          <button onClick={() => setStrategy("avalanche")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "avalanche" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Avalanche</button>
          <button onClick={() => setStrategy("snowball")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "snowball" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Snowball</button>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <Field label="Extra monthly payment ($)">
            <input type="number" className={inputClass} value={extra} onChange={e => setExtra(Math.max(0, parseFloat(e.target.value) || 0))} />
          </Field>
          <div className="space-y-2 text-sm mt-4">
            <div className="flex justify-between"><span className="text-slate-500">Debt-free by</span><span className="font-semibold text-slate-700">{payoffDate}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Months to pay off</span><span className="font-semibold text-slate-700">{result.months}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Total interest paid</span><span className="font-semibold text-rose-600">{fmtCurrency(result.totalInterest, { decimals: false })}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-100">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Payoff order ({strategy})</div>
            <ol className="text-sm text-slate-600 list-decimal list-inside space-y-1">
              {result.payoffOrder.map((name, i) => <li key={i}>{name}</li>)}
            </ol>
          </div>
        </div>
        <div className="md:col-span-2">
          <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Combined balance over time</div>
          <LineChartCanvas labels={scheduleLabels} values={result.schedule.map(v => Math.round(v))} height={220} />
        </div>
      </div>
    </Card>
  );
}

/* ============================== ACCOUNTS ============================== */

function AccountModal({ open, onClose, onSave, initial }) {
  const blank = { name: "", institution: "", type: "checking", balance: "", apr: "" };
  const [form, setForm] = useState(initial || blank);
  useEffect(() => { setForm(initial || blank); }, [initial, open]);

  const submit = (e) => {
    e.preventDefault();
    if (!form.name) return;
    onSave({ ...form, balance: parseFloat(form.balance) || 0, apr: form.apr === "" ? undefined : parseFloat(form.apr) });
  };

  const showApr = form.type === "credit" || form.type === "loan";

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Account" : "Add Account"}>
      <form onSubmit={submit}>
        <Field label="Account name">
          <input className={inputClass} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required />
        </Field>
        <Field label="Institution">
          <input className={inputClass} value={form.institution} onChange={e => setForm({ ...form, institution: e.target.value })} />
        </Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Type">
            <select className={inputClass} value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}>
              {Object.entries(ACCOUNT_TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </Field>
          <Field label="Balance ($, negative for debt)">
            <input type="number" step="0.01" className={inputClass} value={form.balance} onChange={e => setForm({ ...form, balance: e.target.value })} required />
          </Field>
        </div>
        {showApr && (
          <Field label="APR % (used by the Debt Payoff Planner)">
            <input type="number" step="0.01" className={inputClass} value={form.apr} onChange={e => setForm({ ...form, apr: e.target.value })} />
          </Field>
        )}
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={onClose} type="button">Cancel</Button>
          <Button type="submit">Save Account</Button>
        </div>
      </form>
    </Modal>
  );
}

function Accounts({ data, actions, derived }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  const openAdd = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (a) => { setEditing(a); setModalOpen(true); };
  const save = (form) => {
    if (editing) actions.updateAccount({ ...form, id: editing.id });
    else actions.addAccount({ ...form, id: uid() });
    setModalOpen(false);
  };

  const resetDemo = () => {
    if (confirm("Clear the sample demo data (fictional accounts, transactions, budgets, goals, subscriptions)? Your real imported registers — Cindy's Credit Card, Cindy's Checking, Mike's Checking, Savings, and HYSA — will be kept, reset to their originally imported state. This can't be undone.")) actions.resetDemo();
  };

  const assetAccounts = data.accounts.filter(a => a.balance >= 0);
  const debtAccounts = data.accounts.filter(a => a.balance < 0);

  return (
    <div className="p-4 md:p-8 space-y-5 md:space-y-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Accounts</h1>
          <p className="text-slate-500 text-sm mt-1">Manually managed — link states are simulated for this demo.</p>
        </div>
        <div className="flex gap-2">
          <Button variant="secondary" className="flex-1 sm:flex-none" onClick={resetDemo}>Reset Demo Data</Button>
          <Button className="flex-1 sm:flex-none" onClick={openAdd}>+ Add Account</Button>
        </div>
      </div>

      <SectionNotes section="accounts" data={data} actions={actions} />

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-5">
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Net Worth</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(derived.netWorth, { decimals: false })}</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Total Assets</div>
          <div className="text-2xl font-bold text-emerald-600 mt-1">{fmtCurrency(derived.totalAssets, { decimals: false })}</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Total Debt</div>
          <div className="text-2xl font-bold text-rose-600 mt-1">{fmtCurrency(derived.totalDebt, { decimals: false })}</div>
        </Card>
      </div>

      <Card className="p-6">
        <h3 className="font-semibold text-slate-700 mb-4">Assets</h3>
        <div className="space-y-3">
          {assetAccounts.map(a => (
            <div key={a.id} className="flex items-center flex-wrap gap-y-2 justify-between border-b border-slate-50 pb-3 last:border-0 last:pb-0">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-lg shrink-0">{ACCOUNT_TYPE_META[a.type].icon}</div>
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{a.name}</div>
                  <div className="text-xs text-slate-400 truncate">{a.institution} · {ACCOUNT_TYPE_META[a.type].label}</div>
                </div>
              </div>
              <div className="flex items-center gap-4 shrink-0">
                <div className="text-sm font-semibold text-slate-700">{fmtCurrency(a.balance)}</div>
                <button className="text-xs text-indigo-600 font-medium" onClick={() => openEdit(a)}>Edit</button>
                <button className="text-xs text-rose-500 font-medium" onClick={() => actions.deleteAccount(a.id)}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <InvestmentAllocation investments={data.investments} />

      {debtAccounts.length > 0 && (
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-4">Debts</h3>
          <div className="space-y-3">
            {debtAccounts.map(a => (
              <div key={a.id} className="flex items-center flex-wrap gap-y-2 justify-between border-b border-slate-50 pb-3 last:border-0 last:pb-0">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-10 h-10 rounded-xl bg-rose-50 flex items-center justify-center text-lg shrink-0">{ACCOUNT_TYPE_META[a.type].icon}</div>
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-slate-700 truncate">{a.name}</div>
                    <div className="text-xs text-slate-400 truncate">{a.institution} · {ACCOUNT_TYPE_META[a.type].label}{a.apr != null ? ` · ${a.apr}% APR` : ""}</div>
                  </div>
                </div>
                <div className="flex items-center gap-4 shrink-0">
                  <div className="text-sm font-semibold text-rose-600">{fmtCurrency(a.balance)}</div>
                  <button className="text-xs text-indigo-600 font-medium" onClick={() => openEdit(a)}>Edit</button>
                  <button className="text-xs text-rose-500 font-medium" onClick={() => actions.deleteAccount(a.id)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <DebtPayoffPlanner debtAccounts={debtAccounts} />

      <AccountModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={save} initial={editing} />
    </div>
  );
}

/* ============================== APP ROOT ============================== */

const TAB_LABELS = {
  dashboard: "Dashboard", budgets: "Budgets", transactions: "Transactions",
  subscriptions: "Subscriptions & Bills", cashflow: "Cash Flow", goals: "Goals", accounts: "Accounts",
};

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState(() => {
    try {
      const saved = localStorage.getItem(ACTIVE_TAB_KEY);
      return VALID_TABS.includes(saved) ? saved : "dashboard";
    } catch (e) { return "dashboard"; }
  });
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  useEffect(() => { saveData(data); }, [data]);
  useEffect(() => { try { localStorage.setItem(ACTIVE_TAB_KEY, tab); } catch (e) {} }, [tab]);

  const derived = useDerived(data);

  const actions = {
    addTransaction: (t) => setData(d => ({ ...d, transactions: [t, ...d.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)) })),
    updateTransaction: (t) => setData(d => ({ ...d, transactions: d.transactions.map(x => x.id === t.id ? t : x) })),
    deleteTransaction: (id) => setData(d => ({ ...d, transactions: d.transactions.filter(x => x.id !== id) })),

    setBudget: (cat, val) => setData(d => ({ ...d, budgets: { ...d.budgets, [cat]: val } })),

    toggleSubscription: (id) => setData(d => ({ ...d, subscriptions: d.subscriptions.map(s => s.id === id ? { ...s, active: !s.active } : s) })),

    addGoal: (g) => setData(d => ({ ...d, goals: [...d.goals, g] })),
    updateGoal: (g) => setData(d => ({ ...d, goals: d.goals.map(x => x.id === g.id ? g : x) })),
    deleteGoal: (id) => setData(d => ({ ...d, goals: d.goals.filter(x => x.id !== id) })),
    contributeToGoal: (id, amt) => setData(d => ({ ...d, goals: d.goals.map(g => g.id === id ? { ...g, current: Math.max(0, g.current + amt) } : g) })),

    addAccount: (a) => setData(d => ({ ...d, accounts: [...d.accounts, a] })),
    updateAccount: (a) => setData(d => ({ ...d, accounts: d.accounts.map(x => x.id === a.id ? a : x) })),
    deleteAccount: (id) => setData(d => ({ ...d, accounts: d.accounts.filter(x => x.id !== id) })),

    addRule: (r) => setData(d => ({ ...d, rules: [...(d.rules || []), r] })),
    deleteRule: (id) => setData(d => ({ ...d, rules: (d.rules || []).filter(r => r.id !== id) })),
    applyRules: () => setData(d => ({
      ...d,
      transactions: d.transactions.map(t => {
        const match = (d.rules || []).find(r => t.merchant.toLowerCase().includes(r.keyword.toLowerCase()));
        return match ? { ...t, category: match.category } : t;
      }),
    })),

    resetDemo: () => { setData(ensureHouseholdRegisters(ensureCindyRegister(emptyData()))); },

    setCindyNotes: (text) => setData(d => ({ ...d, cindyRegisterNotes: text })),
    setRegisterNotes: (accountId, text) => setData(d => ({ ...d, registerNotes: { ...(d.registerNotes || {}), [accountId]: text } })),
    setSectionNotes: (section, text) => setData(d => ({ ...d, sectionNotes: { ...(d.sectionNotes || {}), [section]: text } })),
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar tab={tab} setTab={setTab} netWorth={derived.netWorth} mobileOpen={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} />
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div className="md:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-200 shrink-0">
          <button onClick={() => setMobileMenuOpen(true)} className="text-slate-600 text-2xl leading-none px-1" aria-label="Open menu">☰</button>
          <div className="font-semibold text-slate-800 truncate">{TAB_LABELS[tab] || "Menu"}</div>
        </div>
        <main className="flex-1 overflow-y-auto">
          {tab === "dashboard" && <Dashboard data={data} derived={derived} actions={actions} />}
          {tab === "budgets" && <Budgets data={data} actions={actions} derived={derived} />}
          {tab === "transactions" && <Transactions data={data} actions={actions} />}
          {tab === "subscriptions" && <Subscriptions data={data} actions={actions} />}
          {tab === "cashflow" && <CashFlow data={data} derived={derived} actions={actions} />}
          {tab === "goals" && <Goals data={data} actions={actions} />}
          {tab === "accounts" && <Accounts data={data} actions={actions} derived={derived} />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
